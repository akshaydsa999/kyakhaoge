 }else if(tab==='hafta'){
  const t=todayIdx(),all=[];
  const rows=Array.from({length:7},(_,k)=>{const p=P(t+k),dt=new Date();dt.setDate(dt.getDate()+k);all.push(p.ni,p.mi);return '<tr><td>'+dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})+'</td><td>'+p.n+'</td><td>'+p.m+(/bhigona/i.test(p.m)?' 🔔':'')+'</td></tr>'}).join('');
  const items=qty(all.join(',')).join(', ');
  const gm='Papa 🛒 is hafte ka saaman:\n'+items;
  v.innerHTML='<div class="card c0"><h2>Agle 7 din (Mummy ke liye)</h2><div class="scroll"><table><tr><th>Din</th><th>Nashta</th><th>Khana</th></tr>'+rows+'</table></div><div class="mut" style="margin-top:6px">🔔 = ek raat pehle bhigona hai</div></div><div class="card c3"><h2>🛒 Hafte ka poora saaman</h2><div class="mut">Andaaza, 2 logon ke hisaab se</div>'+chips(items)+'<div class="row"><a class="btn" target="_blank" rel="noopener" href="'+link(gm,S.pp)+'">Supushpa ko bhejo</a><button class="b o" data-c="'+encodeURIComponent(gm)+'">Copy</button></div></div>';
 }else if(tab==='edit'){
  const p=P(sel);
  v.innerHTML='<div class="card"><h2>Menu edit karo (sirf is phone mein save hoga)</h2><label>Din</label><select id="ed">'+D.map((_,i)=>'<option value="'+i+'"'+(i===sel?' selected':'')+'>Din '+(i+1)+': '+esc(P(i).m)+'</option>').join('')+'</select><label>Nashta</label><input id="e1" value="'+esc(p.n)+'"><label>Nashta kitne min</label><input id="e2" type="number" value="'+p.nt+'"><label>Nashta ka saaman (comma se)</label><input id="e3" value="'+esc(p.ni)+'"><label>Lunch + Dinner</label><input id="e4" value="'+esc(p.m)+'"><label>Khana kitne min</label><input id="e5" type="number" value="'+p.mt+'"><label>Khane ka saaman (comma se)</label><input id="e6" value="'+esc(p.mi)+'"><div class="row"><button class="b" id="sv">Save</button><button class="b o" id="rs">Original wapas</button></div></div>';
  $('#ed').onchange=e=>{sel=+e.target.value;render()};
  $('#sv').onclick=()=>{S.ov=S.ov||{};S.ov[sel]={n:$('#e1').value,nt:+$('#e2').value||0,ni:$('#e3').value,m:$('#e4').value,mt:+$('#e5').value||0,mi:$('#e6').value};save();$('#sv').textContent='Save ho gaya ✓'};
  $('#rs').onclick=()=>{if(S.ov)delete S.ov[sel];save();render()};
 }else if(tab==="chart"){
  const t=todayIdx();
  v.innerHTML='<div class="card"><div class="scroll"><table><tr><th>Din</th><th>Nashta</th><th>Khana</th></tr>'+
  D.map((_,i)=>{const p=P(i);return '<tr class="'+(i===t?"today":"")+'"><td>'+(i+1)+'</td><td>'+p.n+'</td><td>'+p.m+'</td></tr>'}).join("")+
  '</table></div><div class="row noprint"><button class="b" onclick="print()">Fridge ke liye print karo</button></div></div>';
 }else{
  v.innerHTML='<div class="card"><h2>Maid na aaye toh (15-25 min wale)</h2><table>'+BK.map(b=>'<tr><td><b>'+b[0]+'</b></td><td>~'+b[1]+' min</td><td class="mut">'+b[2]+'</td></tr>').join("")+'</table></div>';
 }
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{
  const t=decodeURIComponent(b.dataset.c);
  try{await navigator.clipboard.writeText(t);b.textContent="Copy ho gaya ✓"}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");b.textContent="Copy ho gaya ✓"}catch(x){b.textContent="Copy nahi hua"}a.remove()}
 });
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$("#st").value=S.start;$("#ph").value=S.ph;$("#pp").value=S.pp;$("#pm").value=S.pm;$("#ld").value=S.ld;
$("#st").onchange=e=>{if(e.target.value){S.start=e.target.value;save();sel=todayIdx();render()}};
$("#ph").oninput=e=>{S.ph=e.target.value;save()};$("#pp").oninput=e=>{S.pp=e.target.value;save()};$("#pm").oninput=e=>{S.pm=e.target.value;save()};
$("#ld").onchange=e=>{S.ld=e.target.value;save();render()};
$("#gear").onclick=()=>$("#set").classList.add("on");
$("#gx").onclick=()=>$("#set").classList.remove("on");
sel=todayIdx();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
